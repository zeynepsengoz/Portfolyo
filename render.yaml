services:
  - type: web
    name: portfolyo
    runtime: dotnet
    plan: free
    buildCommand: dotnet restore && dotnet publish -c Release -o out
    startCommand: dotnet out/Portfolyo.dll
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ADMIN_KEY
        sync: false
      - key: JWT_ISSUER
        value: portfolyo
      - key: JWT_AUDIENCE
        value: portfolyo-admin
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_MINUTES
        value: "120"
      - key: DATABASE_URL
        fromDatabase:
          name: portfolyo-db
          property: connectionString

  - type: pserv
    name: portfolyo-db
    plan: free
    postgresMajorVersion: 16
